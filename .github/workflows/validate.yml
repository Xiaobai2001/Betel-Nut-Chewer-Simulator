name: Validate source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: local-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm run build:scene
      - run: node tools/build_wechat.cjs --check
      - run: npm test
      - run: npm run test:accounts
        env:
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_PASSWORD: local-ci-password
      - run: python tools/prepare_publish.py --check-source
      - run: python tools/prepare_publish.py --web-only
      - run: python tools/prepare_publish.py --accounts
      - run: python tools/package_wechat.py
      - run: node --check app/app.js && node --check app/immersive.js && node --check app/account.js && node --check app/progress.js && node --check server/setup.cjs
      - run: git diff --exit-code -- app/immersive-scene.js app/immersive-scene.js.LEGAL.txt app/THREE-LICENSE.txt
