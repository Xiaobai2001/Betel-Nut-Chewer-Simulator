name: Validate source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:scene
      - run: npm test
      - run: python tools/prepare_publish.py --check-source
      - run: python tools/prepare_publish.py --web-only
      - run: node --check app/app.js && node --check app/immersive.js
      - run: git diff --exit-code -- app/immersive-scene.js app/immersive-scene.js.LEGAL.txt app/THREE-LICENSE.txt
